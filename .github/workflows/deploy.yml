name: Deploy Ulitkroshi to JMNext VDS

on:
  push:
    branches:
      - develop
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      skip_build:
        description: 'Skip frontend build step'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-jmnext-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to JMNext VDS
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clean Previous Build Artifacts
        run: |
          docker run --rm -v $(pwd):/work -w /work alpine rm -rf dist || rm -rf dist || true

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Frontend Dependencies
        if: ${{ !inputs.skip_build }}
        run: |
          npm ci

      - name: Build Frontend (PWA & Assets)
        if: ${{ !inputs.skip_build }}
        run: |
          npm run build:front

      - name: Prepare Deployment Environment
        run: |
          mkdir -p deployment
          if [ ! -f deployment/.env ]; then
            cp deployment/.env.example deployment/.env
          fi

      - name: Clean Conflicting Containers and Prepare Volumes
        run: |
          docker volume create ulitkroshi-certbot-etc || true
          docker volume create ulitkroshi-certbot-var || true
          docker rm -f ulitkroshi-certbot ulitkroshi-nginx ulitkroshi-backend ulitkroshi-postgres || true

      - name: Obtain SSL Certificate (Standalone mode if missing)
        run: |
          DOMAIN="ulitkroshi.intelcosystem.com"
          EMAIL="admin@intelcosystem.com"

          CERT_EXISTS=$(docker run --rm -v ulitkroshi-certbot-etc:/etc/letsencrypt alpine sh -c "[ -d /etc/letsencrypt/live/$DOMAIN ] && echo 'yes' || echo 'no'")

          if [ "$CERT_EXISTS" != "yes" ]; then
            echo "🔐 Requesting Let's Encrypt certificate for $DOMAIN via standalone..."
            docker run --rm \
              -p 80:80 \
              -v ulitkroshi-certbot-etc:/etc/letsencrypt \
              -v ulitkroshi-certbot-var:/var/www/certbot \
              certbot/certbot certonly \
              --standalone \
              -d "$DOMAIN" \
              --agree-tos \
              --email "$EMAIL" \
              --non-interactive
            echo "✅ Certificate obtained successfully!"
          else
            echo "✅ SSL certificate for $DOMAIN already exists."
          fi

      - name: Deploy Services with Docker Compose
        run: |
          docker compose -f deployment/docker-compose.yml up -d --build --remove-orphans

      - name: Wait for Services & Health Check
        run: |
          echo "Waiting for services to become healthy on HTTPS..."
          sleep 5
          for i in {1..15}; do
            STATUS=$(curl -k -s -o /dev/null -w "%{http_code}" https://localhost/health || curl -s -o /dev/null -w "%{http_code}" http://localhost/health || true)
            echo "Waiting for health check... attempt $i/15 (got $STATUS)"
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "301" ] || [ "$STATUS" = "302" ]; then
              echo "✅ Service is up and responding with HTTP $STATUS!"
              exit 0
            fi
            sleep 3
          done
          echo "❌ Health check timed out"
          docker compose -f deployment/docker-compose.yml ps
          docker compose -f deployment/docker-compose.yml logs --tail 50
          exit 1

      - name: Clean Unused Docker Images
        if: always()
        run: |
          docker image prune -f --filter "until=48h" || true
