name: Deploy Ulitkroshi to JMNext VDS

on:
  push:
    branches:
      - develop
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      skip_build:
        description: 'Skip frontend build step'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-jmnext-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to JMNext VDS
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Frontend Dependencies
        if: ${{ !inputs.skip_build }}
        run: |
          npm ci

      - name: Build Frontend (PWA & Assets)
        if: ${{ !inputs.skip_build }}
        run: |
          npm run build:front

      - name: Prepare Deployment Environment
        run: |
          mkdir -p deployment
          if [ ! -f deployment/.env ]; then
            if [ -f deployment/.env.example ]; then
              echo "Creating deployment/.env from deployment/.env.example"
              cp deployment/.env.example deployment/.env
            else
              echo "Generating default deployment/.env"
              cat << 'EOF' > deployment/.env
NODE_ENV=production
SERVER_PORT=3005
HTTP_PORT=80
DB_USER=postgres
DB_PASSWORD=ChangeMeStrongPassword2026!
DB_NAME=ulitkroshi_db
DB_HOST=postgres
DB_PORT=5432
JWT_SECRET=super_secret_jwt_key_ulitkroshi_2026_jmnext
SMS_RU_API_KEY=
EOF
            fi
          fi

      - name: Deploy Services with Docker Compose
        run: |
          docker compose -f deployment/docker-compose.yml up -d --build --remove-orphans

      - name: Wait for Services & Health Check
        run: |
          echo "Waiting for services to become healthy..."
          sleep 10
          
          # Check Nginx and Backend
          for i in {1..15}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "✅ All services healthy! HTTP $STATUS"
              exit 0
            fi
            echo "Waiting for health check... attempt $i/15 (got $STATUS)"
            sleep 3
          done
          echo "❌ Health check timed out"
          docker compose -f deployment/docker-compose.yml ps
          docker compose -f deployment/docker-compose.yml logs --tail 50
          exit 1

      - name: Clean Unused Docker Images
        if: always()
        run: |
          docker image prune -f --filter "until=48h" || true
