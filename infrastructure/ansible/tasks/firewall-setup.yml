---
- name: Check if UFW is installed
  command: which ufw
  register: ufw_exists
  ignore_errors: yes
  changed_when: false

- name: Install UFW if missing
  apt:
    name: ufw
    state: present
  when: ufw_exists.rc != 0
  
- name: Reset UFW to default policies
  ufw:
    state: reset
    policy: deny
    direction: incoming

- name: Allow SSH on custom port
  ufw:
    rule: allow
    port: "{{ ssh_port }}"
    proto: tcp

- name: Allow HTTP
  ufw:
    rule: allow
    port: '80'
    proto: tcp

- name: Allow HTTPS
  ufw:
    rule: allow
    port: '443'
    proto: tcp

- name: Allow Seq port (internal)
  ufw:
    rule: allow
    port: '5341'
    proto: tcp

- name: Enable UFW
  ufw:
    state: enabled
    direction: incoming
    policy: deny

- name: Show UFW status
  command: ufw status numbered
  register: ufw_status
  changed_when: false

- name: Display UFW status
  debug:
    msg: "{{ ufw_status.stdout_lines }}"