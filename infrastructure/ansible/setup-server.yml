---
- name: Initial server setup for Ulitkroshi on Debian 13
  hosts: development
  become: yes
  gather_facts: yes  # Явно включаем сбор фактов
  vars:
    user_name: "sysop"
    ssh_port: 2022
    admin_email: "developers@biolivestick.com"
    docker_users: 
      - "{{ user_name }}"
      - "root"
    docker_network_name: "cure-services-network"
    agent_enabled: true
    agent_image: "orion/agent:dev-latest"
    apex_domain: "biolivestick.com"
    agent_port: 9090
    vhosts:
      - name: app-dev
        domain: "dev-app.biolivestick.com"
        port: 3000
        health_check: true

      - name: api-dev
        domain: "dev-api.biolivestick.com"
        port: 5000
        health_check: true

  tasks:
    - name: Include handlers
      ansible.builtin.include_tasks: handlers/main.yml
      when: true
    - name: Fail if not Debian
      fail:
        msg: "This playbook only supports Debian"
      when: ansible_facts['distribution'] != "Debian"

    - name: Check Debian version
      debug:
        msg: "Running on Debian {{ ansible_facts['distribution_version'] }} ({{ ansible_facts['distribution_release'] }})"

    - name: Fail if not Debian 13+
      fail:
        msg: "This playbook requires Debian 13 (Trixie) or newer"
      when: 
        - ansible_facts['distribution'] == "Debian"
        - ansible_facts['distribution_version'] | float < 13

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
    
    - name: Install required system packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - python3-pip
          - git
          - ufw
          - fail2ban
          - htop
          - net-tools
          - jq
          - mc
          - wget
          - systemd-resolved 
          - cron
        state: present
    
    # - name: Include OS-specific variables
    #   include_vars: "{{ ansible_facts['os_family'] }}.yml"
    #   ignore_errors: yes
    
    - name: Install Docker
      include_tasks: tasks/docker-setup.yml
    
    - name: Setup system user
      include_tasks: tasks/user-setup.yml
    
    - name: Setup firewall
      include_tasks: tasks/firewall-setup.yml
    
    - name: Setup Nginx with SSL
      include_tasks: tasks/nginx-setup.yml
    
    - name: Setup fail2ban
      include_tasks: tasks/fail2ban-setup.yml

    - name: Setup GitHub runner (agent)
      include_tasks: tasks/agent-setup.yml
      when: agent_enabled | default(false)
    
    - name: Create application directories
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ user_name }}"
        group: "{{ user_name }}"
        mode: '0755'
      loop:
        - /opt/ulitkroshi
        - /opt/ulitkroshi/deployment
        - /opt/ulitkroshi/scripts
        - /var/log/ulitkroshi
        - /var/backups/ulitkroshi
    
    - name: Setup logrotate
      template:
        src: templates/logrotate.conf.j2
        dest: /etc/logrotate.d/ulitkroshi
        mode: '0644'
    
    - name: Show completion message
      debug:
        msg: |
          ========================================
          Server setup completed on Debian 13!
          
          Access URLs:
          - Website: https://www.{{ apex_domain }}
          - Website: https://dev-app.{{ apex_domain }}
          
          SSH: ssh -p {{ ssh_port }} {{ user_name }}@{{ apex_domain }}
          
          Next steps:
          1. Deploy application: cd /opt/ulitkroshi && docker compose up -d
          2. Check logs: docker compose logs -f
          3. Monitor health: docker ps
          ========================================