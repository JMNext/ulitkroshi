---
- name: Reset UFW to default policies
  ufw:
    state: reset
    policy: deny
    direction: incoming

- name: Allow SSH on custom port
  ufw:
    rule: allow
    port: "{{ ssh_port }}"
    proto: tcp

- name: Allow HTTP
  ufw:
    rule: allow
    port: '80'
    proto: tcp

- name: Allow HTTPS
  ufw:
    rule: allow
    port: '443'
    proto: tcp

- name: Allow FreeSwitch SIP ports
  ufw:
    rule: allow
    port: "{{ item }}"
    proto: udp
  loop:
    - 5060
    - 5061

- name: Allow FreeSwitch Event Socket
  ufw:
    rule: allow
    port: '8021'
    proto: tcp

- name: Allow FreeSwitch RTP ports range
  ufw:
    rule: allow
    port: '16384:16484'
    proto: udp

- name: Allow Seq port (internal)
  ufw:
    rule: allow
    port: '5341'
    proto: tcp

- name: Enable UFW
  ufw:
    state: enabled
    direction: incoming
    policy: deny

- name: Show UFW status
  command: ufw status numbered
  register: ufw_status
  changed_when: false

- name: Display UFW status
  debug:
    msg: "{{ ufw_status.stdout_lines }}"