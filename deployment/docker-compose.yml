name: ulitkroshi

services:
  postgres:
    image: postgres:17-alpine
    container_name: ulitkroshi-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-ulitkroshi_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - ulitkroshi-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-ulitkroshi_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: deployment/backend.Dockerfile
    container_name: ulitkroshi-backend
    restart: always
    environment:
      NODE_ENV: production
      SERVER_PORT: 3005
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      DB_USER: ${DB_USER:-postgres}
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-ulitkroshi_db}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_PORT: 5432
      SMS_RU_API_KEY: ${SMS_RU_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ulitkroshi-network
    expose:
      - "3005"

  nginx:
    image: nginx:1.27-alpine
    container_name: ulitkroshi-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../dist:/var/www/frontend/dist:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/www/certbot
    depends_on:
      - backend
    networks:
      - ulitkroshi-network

  certbot:
    image: certbot/certbot:latest
    container_name: ulitkroshi-certbot
    restart: unless-stopped
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - ulitkroshi-network

networks:
  ulitkroshi-network:
    driver: bridge

volumes:
  postgres-data:
    name: ulitkroshi-postgres-data
  certbot-etc:
    name: ulitkroshi-certbot-etc
  certbot-var:
    name: ulitkroshi-certbot-var
