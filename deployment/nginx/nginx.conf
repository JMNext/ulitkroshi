map \ \ {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Корневой каталог сборки фронтенда PWA
    root /var/www/frontend/dist;
    index index.html;

    # Gzip сжатие текстовых ресурсов
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Healthcheck эндпоинт для проверки живости сервиса
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Кеширование статических медиа-ассетов Phaser и Vite
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|mp4|webm|wav|mp3|ogg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
        try_files \ =404;
    }

    # API маршрутизация: авторизация и сессии
    location /auth/ {
        proxy_pass http://backend:3005/auth/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade \;
        proxy_set_header Connection \;
        proxy_set_header Host \;
        proxy_set_header X-Real-IP \;
        proxy_set_header X-Forwarded-For \;
        proxy_set_header X-Forwarded-Proto \;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # API маршрутизация: игровые механики (проксируем на бэкенд с авто-фоллбэком)
    location /game/ {
        proxy_pass http://backend:3005/auth/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade \;
        proxy_set_header Connection \;
        proxy_set_header Host \;
        proxy_set_header X-Real-IP \;
        proxy_set_header X-Forwarded-For \;
        proxy_set_header X-Forwarded-Proto \;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # SPA роутинг фронтенда (React + Phaser)
    location / {
        try_files \ \/ /index.html;
    }
}
