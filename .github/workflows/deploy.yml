name: Deploy Ulitkroshi to JMNext VDS

on:
  push:
    branches:
      - develop
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      skip_build:
        description: 'Skip frontend build step'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-jmnext-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to JMNext VDS
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clean Previous Build Artifacts
        run: |
          docker run --rm -v $(pwd):/work -w /work alpine rm -rf dist || rm -rf dist || true

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Frontend Dependencies
        if: ${{ !inputs.skip_build }}
        run: |
          npm ci

      - name: Build Frontend (PWA & Assets)
        if: ${{ !inputs.skip_build }}
        run: |
          npm run build:front

      - name: Prepare Deployment Environment
        run: |
          mkdir -p deployment
          if [ ! -f deployment/.env ]; then
            cp deployment/.env.example deployment/.env
          fi

      - name: Bootstrap Dummy SSL Certificate if Missing
        run: |
          DOMAIN="ulitkroshi.intelcosystem.com"
          # Создаем тома через compose и генерируем временный сертификат для безаварийного старта Nginx
          docker volume create ulitkroshi-certbot-etc || true
          docker volume create ulitkroshi-certbot-var || true
          
          docker run --rm -v ulitkroshi-certbot-etc:/etc/letsencrypt alpine sh -c "
            DIR=\"/etc/letsencrypt/live/$DOMAIN\"
            if [ ! -f \"\$DIR/fullchain.pem\" ]; then
              mkdir -p \"\$DIR\"
              apk add --no-cache openssl > /dev/null 2>&1
              openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
                -keyout \"\$DIR/privkey.pem\" \
                -out \"\$DIR/fullchain.pem\" \
                -subj \"/CN=$DOMAIN\" > /dev/null 2>&1
              echo 'Created bootstrap dummy SSL certificate'
            else
              echo 'Certificate already exists in volume'
            fi
          "

      - name: Deploy Services with Docker Compose
        run: |
          docker compose -f deployment/docker-compose.yml up -d --build --remove-orphans

      - name: Verify Nginx is Ready on Port 80
        run: |
          echo "Waiting for Nginx on port 80..."
          for i in {1..15}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "✅ Nginx is listening on port 80! (HTTP $STATUS)"
              exit 0
            fi
            sleep 2
          done
          echo "⚠️ Nginx not responding on port 80, checking logs:"
          docker compose -f deployment/docker-compose.yml logs nginx
          exit 1

      - name: Issue or Renew Let's Encrypt SSL Certificate
        run: |
          DOMAIN="ulitkroshi.intelcosystem.com"
          EMAIL="admin@intelcosystem.com"

          # Проверяем издателя текущего сертификата
          ISSUER=$(docker compose -f deployment/docker-compose.yml exec -T nginx openssl x509 -in /etc/letsencrypt/live/$DOMAIN/fullchain.pem -issuer -noout 2>/dev/null || true)
          echo "Current SSL Certificate Issuer: $ISSUER"

          if echo "$ISSUER" | grep -qv "Let's Encrypt"; then
            echo "🔐 Requesting real Let's Encrypt SSL certificate for $DOMAIN..."
            docker compose -f deployment/docker-compose.yml run --rm --entrypoint "certbot certonly --webroot --webroot-path=/var/www/certbot --email $EMAIL --agree-tos --no-eff-email --force-renewal -d $DOMAIN" certbot
            echo "🔄 Reloading Nginx with new Let's Encrypt certificate..."
            docker compose -f deployment/docker-compose.yml exec -T nginx nginx -s reload || docker compose -f deployment/docker-compose.yml restart nginx
          else
            echo "✅ Valid Let's Encrypt certificate is already active"
          fi

      - name: Wait for Services & Health Check
        run: |
          echo "Waiting for services to become healthy on HTTPS..."
          sleep 5
          for i in {1..15}; do
            STATUS=$(curl -k -s -o /dev/null -w "%{http_code}" https://localhost/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "✅ All services healthy on HTTPS! HTTP $STATUS"
              exit 0
            fi
            echo "Waiting for health check... attempt $i/15 (got $STATUS)"
            sleep 3
          done
          echo "❌ Health check timed out"
          docker compose -f deployment/docker-compose.yml ps
          docker compose -f deployment/docker-compose.yml logs --tail 50
          exit 1

      - name: Clean Unused Docker Images
        if: always()
        run: |
          docker image prune -f --filter "until=48h" || true
