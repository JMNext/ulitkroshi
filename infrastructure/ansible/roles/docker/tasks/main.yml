---
- name: Очистка ошибочных источников репозиториев Docker (если были созданы ранее)
  file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent

- name: Создание директории для ключей APT
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Загрузка официального GPG ключа Docker
  get_url:
    url: "https://download.docker.com/linux/{{ 'debian' if ansible_facts['distribution'] == 'Debian' else 'ubuntu' }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Добавление официального APT репозитория Docker
  apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ 'debian' if ansible_facts['distribution'] == 'Debian' else 'ubuntu' }} {{ 'bookworm' if ansible_facts['distribution_release'] == 'trixie' else ansible_facts['distribution_release'] }} stable"
    state: present
    filename: docker

- name: Установка пакетов Docker Engine и Docker Compose Plugin
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: yes

- name: Добавление пользователей в группу docker
  user:
    name: "{{ item }}"
    groups: docker
    append: yes
  loop: "{{ docker_users }}"

- name: Включение и запуск сервиса Docker
  systemd:
    name: docker
    state: started
    enabled: yes
