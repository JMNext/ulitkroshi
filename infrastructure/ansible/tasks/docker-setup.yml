---
#Debian 13+ Docker installation playbook
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install prerequisites for Docker
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present

- name: Create directory for Docker GPG key
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Docker's official GPG key for Debian
  get_url:
    url: "https://download.docker.com/linux/debian/gpg"
    dest: "/etc/apt/keyrings/docker.asc"
    mode: '0644'
  register: gpg_download
  until: gpg_download is succeeded
  retries: 5
  delay: 5

- name: Add Docker repository (new .sources format for Debian 13+)
  copy:
    dest: /etc/apt/sources.list.d/docker.sources
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/debian
      Suites: {{ ansible_facts['distribution_release'] }}
      Components: stable
      Architectures: {{ ansible_facts['architecture'] | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }}
      Signed-By: /etc/apt/keyrings/docker.asc
    mode: '0644'
  when: ansible_facts['distribution_version'] | float >= 13

- name: Update apt cache after adding Docker repo
  apt:
    update_cache: yes
  when: ansible_facts['distribution_version'] | float >= 13

- name: Install Docker packages
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: yes

- name: Create docker group if it doesn't exist
  group:
    name: docker
    state: present

- name: Add users to docker group
  user:
    name: "{{ item }}"
    groups: docker
    append: yes
  loop:
    - "{{ user_name }}"
    - root
  when: item is defined

- name: Start and enable Docker service
  systemd:
    name: docker
    state: started
    enabled: yes

- name: Wait for Docker to be ready
  command: docker info
  register: docker_info
  until: docker_info.rc == 0
  retries: 10
  delay: 5

- name: Verify Docker installation
  command: docker --version
  register: docker_version
  changed_when: false

- name: Verify Docker Compose plugin
  command: docker compose version
  register: compose_version
  changed_when: false

- name: Display Docker versions
  debug:
    msg:
      - "Docker version: {{ docker_version.stdout }}"
      - "Docker Compose version: {{ compose_version.stdout }}"

- name: Create Docker network for services
  docker_network:
    name: "{{ docker_network_name | default('cure-services-network') }}"
    driver: bridge
    state: present
  register: network_creation

- name: Create Docker network for monitoring
  docker_network:
    name: monitoring-network
    driver: bridge
    state: present
  when: agent_enabled | default(false)

- name: Display network creation status
  debug:
    msg: "Docker network '{{ docker_network_name | default('cure-services-network') }}' is ready"
  when: network_creation.changed