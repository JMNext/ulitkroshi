services:
  postgres:
    image: postgres:17-alpine
    container_name: ulitkroshi-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-ulitkroshi_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - ulitkroshi-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-ulitkroshi_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ..
      dockerfile: deployment/backend.Dockerfile
    container_name: ulitkroshi-backend
    restart: always
    environment:
      NODE_ENV: production
      SERVER_PORT: 3005
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      DB_USER: ${DB_USER:-postgres}
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-ulitkroshi_db}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_PORT: 5432
      SMS_RU_API_KEY: ${SMS_RU_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ulitkroshi-network
    expose:
      - "3005"

  nginx:
    image: nginx:1.27-alpine
    container_name: ulitkroshi-nginx
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../dist:/var/www/frontend/dist:ro
    depends_on:
      - backend
    networks:
      - ulitkroshi-network

networks:
  ulitkroshi-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
