name: CI/CD Pipeline for Development

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'develop'
        type: string
      skip_tests:
        description: 'Skip tests'
        required: false
        default: false
        type: boolean

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20'
  DOCKER_COMPOSE_FILE: 'deployment/docker-compose.dev.yml'
  PROJECT_NAME: 'ulitkroshi'

jobs:
  # Build Docker Images
  build:
    runs-on: [self-hosted, linux, x64]
    if: |
      github.event_name == 'push' || 
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || 'develop' }}
      
      - name: Set build variables
        id: vars
        run: |
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "BUILD_TIMESTAMP=$(date -u +'%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT
          echo "BRANCH_NAME=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT
      
      - name: Generate service version
        run: |
          mkdir -p frontend/public
          cat > frontend/public/service_version.json << EOF
          {
            "version": "${{ steps.vars.outputs.SHORT_SHA }}",
            "build_time": "${{ steps.vars.outputs.BUILD_TIMESTAMP }}",
            "branch": "${{ steps.vars.outputs.BRANCH_NAME }}",
            "environment": "development"
          }
          EOF
      
      - name: Clean old containers
        run: |
          docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} down --remove-orphans || true
      
      - name: Build Docker images
        run: |
          docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} build --no-cache
      
      - name: List built images
        run: |
          docker images | grep -E "ao-ui|ao-api"

  # Deploy to Development
  deploy:
    runs-on: [self-hosted, linux, x64]
    needs: [build]
    if: always() && (needs.build.result == 'success')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || 'develop' }}
      
      - name: Create environment file
        run: |
          cat > .env << EOF
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          EOF
      
      - name: Stop old containers
        run: |
          docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} down
      
      - name: Start new containers
        run: |
          docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} up -d
      
      - name: Wait for services to be ready
        run: |
          echo "Waiting for services to be ready..."
          sleep 10
          
          # Check backend health
          for i in {1..30}; do
            if curl -f -s http://localhost:8080/health > /dev/null 2>&1; then
              echo "✅ Backend is healthy!"
              break
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
          
          # Check frontend health
          for i in {1..30}; do
            if curl -f -s http://localhost:8088/health > /dev/null 2>&1; then
              echo "✅ Frontend is healthy!"
              break
            fi
            echo "Waiting for frontend... ($i/30)"
            sleep 2
          done
      
      - name: Show running containers
        run: |
          docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
      
      - name: Cleanup old images
        run: |
          docker image prune -f --filter "until=24h"

  # Verification
  verify:
    runs-on: ubuntu-latest
    needs: [deploy]
    if: success()
    steps:
      - name: Verify Backend
        run: |
          curl -f https://dev-app.biolivestick.com/health
          echo "✅ API is responding"
      
      - name: Verify Frontend
        run: |
          curl -f https://dev-app.biolivestick.com.com
          echo "✅ Frontend is responding"